<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L-0 Blog</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            background: white;
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
        }
        header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        header p { color: #666; }
        .badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 10px;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .card h2 {
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #444;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        textarea { resize: vertical; min-height: 100px; }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover { background: #5a6fd6; }
        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        .btn-danger:hover { background: #c0392b; }
        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }
        .post {
            border-left: 4px solid #667eea;
            padding-left: 20px;
            margin-bottom: 20px;
        }
        .post h3 {
            color: #333;
            margin-bottom: 8px;
        }
        .post .content {
            color: #555;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        .post .meta {
            color: #888;
            font-size: 13px;
        }
        .post .actions {
            margin-top: 10px;
        }
        .post .actions form {
            display: inline;
        }
        footer {
            text-align: center;
            color: white;
            padding: 20px;
            opacity: 0.8;
        }
        .flex { display: flex; gap: 10px; }
        .flex-1 { flex: 1; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>L-0 Blog</h1>
        <p>A blog system powered by L-0 Virtual Machine</p>
        <span class="badge">SQLite + HTTP</span>
    </header>
    <div class="card">
        <h2>Create New Post</h2>
        <form action="/create" method="POST">
            <div class="form-group">
                <label>Title</label>
                <input type="text" name="title" placeholder="Enter post title" required>
            </div>
            <div class="flex">
                <div class="form-group flex-1">
                    <label>Author</label>
                    <input type="text" name="author" placeholder="Your name" required>
                </div>
            </div>
            <div class="form-group">
                <label>Content</label>
                <textarea name="content" placeholder="Write your post content here..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Create Post</button>
        </form>
    </div>
    <div class="card">
        <h2>All Posts</h2>
        <div class="posts-list">
<script type='application/json' id='posts-data'>[{"author":"Admin","content":"This is a sample post demonstrating the L-0 VM blog system with SQLite database.","created_at":"2026-02-01 10:34:14","id":1,"title":"Welcome to L-0 Blog"},{"author":"Developer","content":"L-0 is a custom virtual machine designed for AI agents. It uses assembly-like syntax.","created_at":"2026-02-01 10:34:14","id":2,"title":"Getting Started with L-0"},{"author":"Admin","content":"L-0 supports SQLite with full CRUD: Create Read Update Delete operations.","created_at":"2026-02-01 10:34:14","id":3,"title":"Database Operations"}]</script><div id='posts-container'></div>        </div>
    </div>

    <div class="card">
        <h2>Quick Actions</h2>
        <form action="/update" method="POST" style="margin-bottom: 15px;">
            <div class="flex">
                <input type="number" name="id" placeholder="Post ID" style="width: 100px;" required>
                <input type="text" name="title" placeholder="New Title" class="flex-1">
                <input type="text" name="content" placeholder="New Content" class="flex-1">
                <button type="submit" class="btn btn-primary btn-small">Update</button>
            </div>
        </form>
        <form action="/delete" method="POST">
            <div class="flex">
                <input type="number" name="id" placeholder="Post ID to delete" style="width: 200px;" required>
                <button type="submit" class="btn btn-danger btn-small">Delete Post</button>
            </div>
        </form>
    </div>

    <script>
        (function() {
            const container = document.getElementById('posts-container');
            if (!container) return;

            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
            }

            function renderPosts(posts) {
                if (!posts || !posts.length) {
                    container.innerHTML = '<p style="color:#888;text-align:center;padding:20px;">No posts yet. Create your first post above!</p>';
                    return;
                }

                container.innerHTML = posts.map(post => `
                    <div class="post">
                        <h3>${escapeHtml(post.title)}</h3>
                        <p class="content">${escapeHtml(post.content)}</p>
                        <p class="meta">
                            <strong>ID: ${post.id}</strong> |
                            By ${escapeHtml(post.author)} |
                            ${post.created_at}
                        </p>
                    </div>
                `).join('');
            }

            // Try to load from API first, fallback to embedded data
            fetch('/api/posts')
                .then(res => res.json())
                .then(data => {
                    // Handle wrapped response: {"ok":true,"value":[...]}
                    const posts = data.value || data;
                    renderPosts(Array.isArray(posts) ? posts : []);
                })
                .catch(() => {
                    // Fallback to embedded data
                    const dataEl = document.getElementById('posts-data');
                    if (dataEl) {
                        try {
                            renderPosts(JSON.parse(dataEl.textContent));
                        } catch(e) {
                            container.innerHTML = '<p style="color:#e74c3c;">Error loading posts</p>';
                        }
                    }
                });
        })();
    </script>
    <footer>
        <p>L-0 VM Preview | 52 ISA Instructions | Semantic Computing</p>
    </footer>
</div>
</body>
</html>
