[package]
name = "l0"
version = "1.0.0"
edition = "2021"
description = "L-0 Language Toolchain - VM and AOT Compiler"

[[bin]]
name = "l0vm"
path = "src/vm.rs"


[[bin]]
name = "l0asm"
path = "src/asm.rs"

[dependencies]
atty = "0.2.14"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
bincode = "1.3"
