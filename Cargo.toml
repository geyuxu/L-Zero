[workspace]
resolver = "2"
members = [
    "crates/l0_core",
    "crates/l0_vm",
    "crates/l0_asm",
    "crates/l0_compiler",
    "plugins/file_plugin",
    "plugins/data_plugin",
    "plugins/http_plugin",
    "plugins/db_plugin",
]

[workspace.package]
version = "0.0.2-preview"
edition = "2021"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
regex = "1.12"
atty = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
l0_core = { path = "crates/l0_core" }
